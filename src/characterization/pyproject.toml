[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scope"
version = "0.1.0"
description = "Oscilloscope-based vibration characterization for Rigol DS1104Z"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
    "matplotlib>=3.7",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "pyvisa>=1.13",
    "pyvisa-py>=0.7",
    "pyserial>=3.5",
    "tqdm>=4.65",
    "rich>=13.0",
    "typer>=0.9",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
    "mypy>=1.5",
]
extra = [
    "h5py>=3.9",
    "plotly>=5.15",
]
notebooks = [
    "jupyter>=1.0",
    "jupyterlab>=4.0",
    "nbconvert>=7.0",
    "ipykernel>=6.0",
    "ipywidgets>=8.0",
]

[project.scripts]
scope = "scope.cli:app"

[tool.setuptools.packages.find]
where = ["instrument_control"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
