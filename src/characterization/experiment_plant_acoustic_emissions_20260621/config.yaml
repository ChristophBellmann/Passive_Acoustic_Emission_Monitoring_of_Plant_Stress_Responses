# Experiment Configuration: Plant Acoustic Emissions
# Date: 2026-06-21
# Experiment ID: plant_ae_3ch_20260621

instrument:
  visa_resource: "TCPIP::192.168.178.70::INSTR"
  idn_expected_contains: ["RIGOL", "DS1104Z"]
  timeout_ms: 10000

oscilloscope:
  channels: [1, 3, 4]
  channel_settings:
    1:
      enabled: true
      label: "piezo_amplified_lm358_820k"
      probe_ratio: 10
      coupling: "AC"
      vertical_scale_v_per_div: 0.5
      offset_v: 0.0
      amplitude_calibrated: false
      notes: "Piezo sensor with amplifier and 820 kΩ resistor, 10:1 probe"
    2:
      enabled: false
      label: "piezo_820k_direct"
      probe_ratio: 1
      coupling: "AC"
      vertical_scale_v_per_div: 0.01  # 10 mV/div
      offset_v: 0.0
      amplitude_calibrated: false
      notes: "Disabled: CH2 hardware fault / not part of current setup"
    3:
      enabled: true
      label: "piezo_amplified_lm358_820k_metal_rod_a"
      probe_ratio: 10
      coupling: "AC"
      vertical_scale_v_per_div: 0.5
      offset_v: 0.0
      amplitude_calibrated: false
      notes: "Piezo sensor with amplifier and 820 kΩ resistor on metal rod, 10:1 probe"
    4:
      enabled: true
      label: "piezo_amplified_lm358_820k_metal_rod_b"
      probe_ratio: 10
      coupling: "AC"
      vertical_scale_v_per_div: 0.5
      offset_v: 0.0
      amplitude_calibrated: false
      notes: "Piezo sensor with amplifier and 820 kΩ resistor on metal rod, 10:1 probe"

acquisition:
  captures: 20
  delay_between_captures_s: 0.3
  memory_depth: "100000"
  waveform_mode: "RAW"
  waveform_format: "BYTE"
  auto_setup_allowed: false
  stop_before_read: false
  restore_run_after_read: false

processing:
  remove_dc: true
  detrend: true
  window: "hann"
  min_frequency_hz: 20
  max_frequency_hz: 5000
  welch:
    enabled: true
    nperseg: 1024
    overlap: 0.5
  stft:
    enabled: false
    nperseg: 512
    overlap: 0.75

peak_detection:
  prominence_db: 3.0
  min_distance_hz: 50
  max_peaks: 10
  ignore_frequency_bands_hz:
    - [48, 52]
    - [98, 102]

output:
  save_raw_csv: false
  save_npz: true
  save_plots: true
  save_report_markdown: false
  plot_format: "png"
